{{- /* Visible FAQ matching the FAQPage JSON-LD. Param: list of {q, a} */ -}}
{{- with . }}
<section aria-labelledby="faq-title" class="mt-20">
  <h2 id="faq-title" class="display mb-6 text-[clamp(28px,3.4vw,36px)]">Frequently asked questions</h2>
  <div class="flex flex-col gap-3">
    {{- range . }}
    <details class="group rounded-xl border border-line bg-panel px-5">
      <summary class="flex min-h-14 cursor-pointer list-none items-center justify-between gap-4 font-semibold text-ink [&::-webkit-details-marker]:hidden">
        <h3 class="text-[17px] font-semibold">{{ .q }}</h3>
        <svg class="shrink-0 transition-transform group-open:rotate-45" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </summary>
      <div class="prose-bb pb-5 text-base">{{ .a | markdownify }}</div>
    </details>
    {{- end }}
  </div>
</section>
{{- end }}
