{{- /* Newsletter capture. Posts to Substack's hosted subscribe page. */ -}}
<section class="mt-24 bg-night text-on-night" aria-labelledby="subscribe-title">
  <div class="wrap flex flex-wrap items-center justify-between gap-8 py-16">
    <div class="flex max-w-[560px] flex-col gap-2">
      <h2 id="subscribe-title" class="display text-[clamp(30px,4vw,40px)]">{{ .title | default "Get the next post by email." }}</h2>
      <p class="text-[17px] text-on-night2">One email per new post or tutorial. Unsubscribe any time.</p>
    </div>
    <form action="{{ site.Params.newsletter }}" method="get" target="_blank" rel="noopener" class="flex max-w-[520px] flex-[1_1_380px] flex-wrap gap-2.5">
      <label for="sub-email" class="sr-only">Email address</label>
      <input id="sub-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" class="field min-h-[52px] flex-[1_1_220px] border-[#4a4f59] bg-night2 text-on-night placeholder:text-on-night2">
      <button type="submit" class="btn btn-accent min-h-[52px] px-6 text-base">Subscribe</button>
    </form>
  </div>
</section>
